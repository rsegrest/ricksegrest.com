<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Display Benchmark</title>
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{color:#b8ffb8;background:#050505;flex-direction:column;height:100vh;margin:0;display:flex}header{border-bottom:1px solid #143314;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:10px 16px;font-size:13px;display:flex}nav a{color:#e8ffe8;margin-right:14px}nav a[aria-current=page]{color:#7dff7d;font-weight:700;text-decoration:none}label{align-items:center;gap:6px;display:flex}select,input[type=number]{color:inherit;font:inherit;background:#0c1a0c;border:1px solid #245524;padding:2px 4px}input[type=range]{width:110px}#stats{white-space:pre;color:#e8ffe8;margin-left:auto;line-height:1.35}#stage{flex:1;justify-content:center;align-items:center;display:flex;overflow:hidden}#p5-container canvas,#webgl-canvas{background:#000;display:block}[hidden]{display:none!important}</style>
    <script type="module" crossorigin src="./assets/benchmark-C9c3hsgN.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/PhosphorPipeline-BR9wAGG7.js">
    <link rel="modulepreload" crossorigin href="./assets/Vector-saZCaGK6.js">
  </head>
  <body>
    <header>
      <nav><a href="/" aria-current="page">Renderer benchmark</a><a href="/font-and-3d.html">Font &amp; 3D</a></nav>
      <label>Renderer
        <select id="renderer-mode">
          <option value="p5">p5.js (Canvas 2D)</option>
          <option value="webgl">WebGL2</option>
          <option value="phosphor" selected>WebGL2 + phosphor</option>
        </select>
      </label>
      <label>Asteroids
        <select id="asteroid-count">
          <option>10</option><option selected>40</option><option>250</option><option>1000</option><option>5000</option><option>20000</option>
        </select>
      </label>
      <label class="webgl-control">Vertex dwell <input id="vertex-dwell" type="range" min="0" max="150" value="60" /></label>
      <label class="webgl-control">Joint overlap <input id="joint-overlap" type="range" min="0" max="100" value="100" /></label>
      <label class="phosphor-control">Persistence <input id="persistence" type="range" min="5" max="400" value="40" /></label>
      <label class="phosphor-control">Bloom <input id="bloom" type="range" min="0" max="300" value="120" /></label>
      <label class="phosphor-control">Flicker <input id="flicker" type="range" min="0" max="50" value="8" /></label>
      <label class="phosphor-control">Flicker Hz <input id="flicker-frequency" type="range" min="1" max="60" value="15" /></label>
      <div id="stats"></div>
    </header>
    <main id="stage">
      <div id="p5-container" hidden></div>
      <canvas id="webgl-canvas"></canvas>
    </main>
  </body>
</html>
